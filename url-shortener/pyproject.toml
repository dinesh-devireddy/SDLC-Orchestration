[build-system]
requires = ["setuptools==75.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "interview-url-shortener"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.8", "uvicorn==0.34.0", "pydantic==2.10.6",
  "SQLAlchemy==2.0.38", "alembic==1.14.1",
]

[project.optional-dependencies]
dev = ["pytest==8.3.4", "httpx==0.28.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
shortener = ["migrations/script.py.mako", "web/*.html", "web/*.css", "web/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
